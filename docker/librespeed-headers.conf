# Cache lifetimes and two security headers for the static frontend.
# Fonts and images rarely change; code and locales may change with a deploy, so
# they get a day, not a month. HTML and the json files an operator edits
# (settings.json, server-list.json, config.json) are left alone.
<IfModule mod_headers.c>
	<FilesMatch "\.(woff2|webp|svg|png|ico)$">
		Header set Cache-Control "public, max-age=2592000"
	</FilesMatch>
	<FilesMatch "\.(js|css)$">
		Header set Cache-Control "public, max-age=86400"
	</FilesMatch>
	<LocationMatch "/(locales|icons)/[^/]+\.json$">
		Header set Cache-Control "public, max-age=86400"
	</LocationMatch>
	Header always set Cross-Origin-Opener-Policy "same-origin"
	Header always set X-Content-Type-Options "nosniff"
</IfModule>

name: Code Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.VANDAME_APP_ID }}
          private-key: ${{ secrets.VANDAME_APP_PRIVATE_KEY }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_ENTERPRISE }}
          github_token: ${{ steps.app-token.outputs.token }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}. Para correções pequenas e diretas, formate o corpo do comentário inline com um bloco de código na linguagem 'suggestion' contendo o texto substituto exato, para habilitar o botão 'Commit suggestion' do GitHub."
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
